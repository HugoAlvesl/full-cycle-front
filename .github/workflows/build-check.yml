name: Build

on:
  push:
    branches-ignore:
      - "dependabot/**"
  pull_request:
    branches:
      - main

env:
  FORCE_COLOR: 2
  NODE: 24

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: 'npm'

      # ========================
      # Install & Test
      # ========================
      - name: Install Dependencies
        run: npm ci

#      - name: Run Tests
#        run: npm test -- --watch=false --browsers=ChromeHeadless
